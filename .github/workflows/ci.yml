name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit lua-busted luarocks

      - name: Static analysis (luacheck)
        run: |
          sudo luarocks install luacheck 0.26.1 --force 2>/dev/null || sudo luarocks install luacheck --force
          luacheck --version | head -1
          luacheck dual_wiki.koplugin tests

      - name: Syntax check (luac -p)
        run: |
          luac -p dual_wiki.koplugin/main.lua
          luac -p dual_wiki.koplugin/_meta.lua
          luac -p tests/test_query_helpers.lua

      - name: Unit tests (query helpers)
        run: lua tests/test_query_helpers.lua dual_wiki.koplugin/main.lua

      - name: Locale sanity (mo files up to date)
        run: |
          sudo apt-get install -y gettext
          for po in dual_wiki.koplugin/locale/*.po; do
            lang=$(basename "$po" .po)
            msgfmt -o "/tmp/$lang.mo" "$po"
            bundled="dual_wiki.koplugin/locale/$lang/LC_MESSAGES/dual_wiki.mo"
            if [ "$lang" = "messages" ]; then continue; fi
            if ! cmp -s "/tmp/$lang.mo" "$bundled"; then
              echo "::error::$bundled is stale — recompile from $po (msgfmt -o $bundled $po)"
              exit 1
            fi
          done

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          META_VERSION=$(sed -n 's/^[[:space:]]*version = "\(.*\)",[[:space:]]*$/\1/p' dual_wiki.koplugin/_meta.lua)
          if [ -z "$META_VERSION" ]; then
            echo "::error::could not read version from dual_wiki.koplugin/_meta.lua"
            exit 1
          fi
          if [ "$VERSION" != "$META_VERSION" ]; then
            echo "::error::tag v${VERSION} does not match _meta.lua version ${META_VERSION} — fix the tag or bump the plugin version"
            exit 1
          fi

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          zip -r "koreader-dual-wiki-v${VERSION}.zip" dual_wiki.koplugin -x "*.DS_Store"

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Exact filename, NOT a glob: the repo tree carries historical
          # release zips (v1.3.0/v1.3.1), and koreader-dual-wiki-v*.zip
          # would attach those stale artifacts to every new release.
          # ref_name on a tag ref already includes the leading "v".
          files: koreader-dual-wiki-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
